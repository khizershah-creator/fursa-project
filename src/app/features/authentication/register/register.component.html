<div class="auth-shell">
  <p-card class="auth-card">
    <!-- Back button -->
    <button type="button" class="back-btn" (click)="goBack()" pRipple>
      <i class="pi pi-arrow-left"></i>
      <span>Back</span>
    </button>

    <!-- Top icon -->
    <div class="center head__icon">
      <span class="pi pi-user-plus badge-icon"></span>
    </div>

    <h1 class="auth-title center">Create a new account</h1>
    <div class="auth-subtitle center">Join the Deals of the Day platform</div>

    <form [formGroup]="form" class="p-fluid" (ngSubmit)="onSubmit()">
      <!-- Full name -->
      <div class="field">
        <label>full name</label>
        <div class="input-wrap">
          <input pInputText class="text-input has-suffix"
                 formControlName="fullName"
                 placeholder="Enter your full name"/>
          <i class="pi pi-user suffix"></i>
        </div>
        <div class="err" *ngIf="f['fullName'].touched && f['fullName'].invalid">
          Please enter at least 3 characters.
        </div>
      </div>

      <!-- Email -->
      <div class="field">
        <label>e-mail</label>
        <div class="input-wrap">
          <input pInputText class="text-input has-suffix"
                 type="email"
                 formControlName="email"
                 placeholder="example@email.com"/>
          <i class="pi pi-envelope suffix"></i>
        </div>
        <div class="err" *ngIf="f['email'].touched && f['email'].invalid">
          Please enter a valid email address.
        </div>
      </div>

      <!-- Role -->
      <div class="field">
        <label>Account type</label>
        <p-dropdown
          formControlName="role"
          [options]="roles"
          optionLabel="label"
          optionValue="value"
          styleClass="dd text-input"
          [style]="{ width:'100%' }"
          placeholder="Select account type">
        </p-dropdown>
      </div>

      <!-- Password -->
      <div class="field">
        <label>password</label>
        <div class="input-wrap">
          <p-password
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            inputStyleClass="text-input pw-input has-suffix"
            styleClass="pw">
          </p-password>
          <i class="pi pi-lock suffix"></i>
        </div>
        <div class="err" *ngIf="f['password'].touched && f['password'].hasError('minlength')">
          At least 8 characters.
        </div>
      </div>

      <!-- Confirm -->
      <div class="field">
        <label>Confirm password</label>
        <div class="input-wrap">
          <p-password
            formControlName="confirm"
            [feedback]="false"
            [toggleMask]="true"
            inputStyleClass="text-input pw-input has-suffix"
            styleClass="pw">
          </p-password>
          <i class="pi pi-lock suffix"></i>
        </div>
        <div class="err" *ngIf="form.touched && (form.hasError('mismatch') || f['confirm'].invalid)">
          Passwords must match.
        </div>
      </div>

      <!-- CTA -->
      <!-- CTA -->
<button
  pButton
  type="submit"
  class="cta raise btn-green w-full"
  label="Create an account">
</button>


      <div class="center mt-3">
        <a routerLink="/login" class="link-blue">Log in</a>
        <span>&nbsp;Do you already have an account?</span>
      </div>
    </form>
  </p-card>
</div>
