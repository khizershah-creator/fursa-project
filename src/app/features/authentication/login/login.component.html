<div class="login-shell">
  <div class="panel">

    <!-- Back -->
    <a class="back" routerLink="/">
      <i class="pi pi-arrow-left"></i>
      <span>Return to homepage</span>
    </a>

    <!-- Top icon -->
    <div class="big-icon">
      <i class="pi pi-sign-in"></i>
    </div>

    <!-- Heading -->
    <h1 class="title">Log in</h1>
    <p class="subtitle">Log in to your account on the Deals platform</p>

    <!-- Account type -->
    <div class="section-label">Account type</div>
    <div class="role-tiles">
      <!-- Vendor (green) -->
      <div
        class="role-card"
        [ngClass]="{ active: role === 'seller', vendor: role === 'seller' }"
        (click)="role = 'seller'">
        <div class="role-card__title">Vendor</div>
        <div class="role-card__desc">I want to sell or finance my business</div>
      </div>

      <!-- Investor (blue) -->
      <div
        class="role-card"
        [ngClass]="{ active: role === 'investor', investor: role === 'investor' }"
        (click)="role = 'investor'">
        <div class="role-card__title">Investor</div>
        <div class="role-card__desc">I am looking for investment opportunities</div>
      </div>
    </div>

    <!-- Email -->
    <label class="field-label">e-mail</label>
    <div class="input-wrap">
      <input
        type="email"
        pInputText
        [(ngModel)]="email"
        placeholder="example@email.com" />
      <i class="pi pi-envelope input-icon"></i>
    </div>

    <!-- Password -->
    <label class="field-label">password</label>
    <div class="input-wrap">
      <p-password
        [(ngModel)]="password"
        [toggleMask]="true"
        [feedback]="false"
        placeholder="••••••••">
      </p-password>
      <i class="pi pi-lock input-icon"></i>
    </div>

    <!-- CTA -->
    <button
      pButton
      type="button"
      class="btn-blue full-w cta"
      [disabled]="!email || !password || isSubmitting"
      icon="pi pi-arrow-right"
      iconPos="left"
      label="entrance"
      (click)="onLogin()"
      pRipple>
    </button>

    <!-- Footer -->
    <div class="bottom-note">
      <a routerLink="/register" class="link-blue">Create a new account</a>
      <span>Don’t have an account?</span>
    </div>
  </div>
</div>
